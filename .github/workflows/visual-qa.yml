name: Visual QA

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Responsive Playwright QA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview:qa > /tmp/crossedarts-preview.log 2>&1 &
          echo $! > /tmp/crossedarts-preview.pid

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Preview server did not become ready.'
          cat /tmp/crossedarts-preview.log || true
          exit 1

      - name: Run visual QA
        env:
          QA_URL: http://127.0.0.1:4173
          QA_SHOTS: /tmp/crossedarts-qa
        run: npm run qa:visual

      - name: Upload screenshots and preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crossedarts-visual-qa
          path: |
            /tmp/crossedarts-qa
            /tmp/crossedarts-preview.log
          if-no-files-found: ignore

      - name: Stop preview server
        if: always()
        run: |
          if [[ -f /tmp/crossedarts-preview.pid ]]; then
            kill "$(cat /tmp/crossedarts-preview.pid)" || true
          fi
