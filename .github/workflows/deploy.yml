name: Deploy CrossedArts to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-backend:
    name: Backend Quality & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.lock

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Lint Backend (Ruff)
        run: python -m ruff check backend/app

      - name: Typecheck Backend (Mypy)
        run: PYTHONPATH=. python -m mypy backend/app

      - name: Run Backend Pytest Suite
        run: PYTHONPATH=. pytest backend/tests -q

  build-frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck Frontend
        run: npm run typecheck

      - name: Run Zero-Web-Access Test Fleet
        run: npm test

      - name: Build Web Application
        run: npm run build

      # La QA visual se ejecuta SOBRE EL MISMO build de producción que se va a
      # publicar, en este mismo job: así el despliegue solo se publica si la app
      # responde en escritorio, tableta y móvil, y no se duplica la instalación
      # de dependencias ni la compilación en un job aparte.
      - name: Install Chromium for Visual QA
        run: npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npm run preview:qa > /tmp/crossedarts-preview.log 2>&1 &
          echo $! > /tmp/crossedarts-preview.pid

      - name: Wait for preview
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Preview server did not become ready.'
          cat /tmp/crossedarts-preview.log || true
          exit 1

      - name: Run visual QA against the production build
        env:
          QA_URL: http://127.0.0.1:4173
          QA_SHOTS: /tmp/crossedarts-qa
        run: npm run qa:visual

      - name: Stop preview server
        if: always()
        run: |
          if [[ -f /tmp/crossedarts-preview.pid ]]; then
            kill "$(cat /tmp/crossedarts-preview.pid)" || true
          fi

      - name: Upload screenshots and preview logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crossedarts-visual-qa-deploy
          path: |
            /tmp/crossedarts-qa
            /tmp/crossedarts-preview.log
          if-no-files-found: ignore

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build-frontend, validate-backend]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
